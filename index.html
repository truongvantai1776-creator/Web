<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T HUB Key System Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #090d16;
            color: #f3f4f6;
        }
        .glow-effect {
            box-shadow: 0 0 50px -10px rgba(99, 102, 241, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <div id="main-card" class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-8 glow-effect text-center relative overflow-hidden transition-all duration-300">
        
        <!-- Top decorative badge / timer indicator -->
        <div class="absolute top-4 right-4 text-xs font-mono text-slate-500 bg-slate-800/50 px-2.5 py-1 rounded-full border border-slate-700/50">
            <i class="fa-regular fa-clock mr-1 text-indigo-400"></i><span id="countdown">30:00</span>
        </div>

        <div class="mb-8 mt-2">
            <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-indigo-500/30 mb-4 transform hover:scale-105 transition-transform duration-300">
                <i class="fa-solid fa-key text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white mb-1">T HUB Key System</h1>
            <p class="text-sm text-slate-400">Your secure access key has been generated.</p>
        </div>

        <div class="mb-6 relative group">
            <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl blur opacity-30 group-hover:opacity-60 transition duration-300"></div>
            <div class="relative bg-slate-950 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
                <span id="key-text" class="font-mono text-sm md:text-base text-indigo-300 tracking-wider font-semibold truncate mr-2 select-all">Loading...</span>
            </div>
        </div>

        <div>
            <button onclick="copyKey()" id="copy-btn" class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition-all duration-200 flex items-center justify-center space-x-2 cursor-pointer">
                <i class="fa-regular fa-copy text-lg"></i>
                <span id="copy-text">Copy Key</span>
            </button>
        </div>

        <div id="toast" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 translate-y-16 opacity-0 bg-emerald-600 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-lg transition-all duration-300 flex items-center space-x-1.5">
            <i class="fa-solid fa-check"></i>
            <span>Copied to clipboard!</span>
        </div>
    </div>

    <div id="expired-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full text-center">
            <div class="w-12 h-12 bg-rose-500/10 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-triangle-exclamation text-xl"></i>
            </div>
            <h2 class="text-xl font-bold text-white mb-2">Session Expired</h2>
            <p class="text-sm text-slate-400 mb-6">This key session has timed out after 30 minutes for security reasons. Closing window...</p>
            <button onclick="window.location.reload()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium rounded-xl transition-colors">
                Generate New Key
            </button>
        </div>
    </div>

    <script>
        // Generate a completely unique, secure random key every time the page loads
        function generateUniqueKey() {
            const part1 = Math.random().toString(36).substring(2, 8).toUpperCase();
            const part2 = Math.random().toString(36).substring(2, 8).toUpperCase();
            const part3 = Math.random().toString(36).substring(2, 8).toUpperCase();
            const timestamp = Date.now().toString(36).toUpperCase();
            return `THUB-${part1}-${part2}-${part3}-${timestamp}`;
        }

        // Set the unique key into the DOM on load
        window.onload = function() {
            const uniqueKey = generateUniqueKey();
            document.getElementById('key-text').innerText = uniqueKey;
            startCountdown(30 * 60); // 30 minutes timer
        };

        // Copy key handler using legacy execCommand fallback safely for all environments
        function copyKey() {
            const keyElement = document.getElementById('key-text');
            const textToCopy = keyElement.innerText;

            const tempInput = document.createElement('textarea');
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            // Button feedback & Toast animation
            const copyBtn = document.getElementById('copy-btn');
            const copyText = document.getElementById('copy-text');
            const toast = document.getElementById('toast');

            copyBtn.classList.remove('from-indigo-600', 'to-violet-600');
            copyBtn.classList.add('from-emerald-600', 'to-teal-600', 'shadow-emerald-600/30');
            copyText.innerText = 'Copied!';

            toast.classList.remove('translate-y-16', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                copyBtn.classList.remove('from-emerald-600', 'to-teal-600', 'shadow-emerald-600/30');
                copyBtn.classList.add('from-indigo-600', 'to-violet-600');
                copyText.innerText = 'Copy Key';

                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-16', 'opacity-0');
            }, 2000);
        }

        // 30 minutes auto-close countdown logic
        function startCountdown(durationInSeconds) {
            let timer = durationInSeconds;
            const countdownEl = document.getElementById('countdown');

            const interval = setInterval(() => {
                const minutes = Math.floor(timer / 60);
                const seconds = timer % 60;

                countdownEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                if (--timer < 0) {
                    clearInterval(interval);
                    triggerAutoClose();
                }
            }, 1000);
        }

        // Close or lock page when time runs out
        function triggerAutoClose() {
            document.getElementById('expired-modal').classList.remove('hidden');
            document.getElementById('expired-modal').classList.add('flex');
            
            // Attempt to close window (modern browsers restrict window.close unless opened by script, fallback handles overlay)
            try {
                window.close();
            } catch(e) {
                console.log("Window close restricted by browser policies.");
            }
        }
    </script>
</body>
</html>
